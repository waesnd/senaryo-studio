name: Security regression tests
on:
  push:
    branches:
      - fix/fabularc-p0-api-safety
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run isolated API security regressions
        run: npm test
      - name: Compile Next.js app using non-secret CI placeholders
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-secret
        run: npm run build
