name: Brand asset checks
on:
  push:
    branches:
      - feat/fabularc-brand-assets-v1
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  brand-assets:
    if: github.head_ref == 'feat/fabularc-brand-assets-v1' || github.ref_name == 'feat/fabularc-brand-assets-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run brand integrity tests
        run: npm test
      - name: Compile branded Next.js app using non-secret placeholders
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-secret
        run: npm run build
