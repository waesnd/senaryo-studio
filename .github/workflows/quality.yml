name: Fabularc integrated quality gate
on:
  push:
    branches:
      - integration/fabularc-foundation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    if: github.head_ref == 'integration/fabularc-foundation' || github.ref_name == 'integration/fabularc-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build with fake public Supabase configuration
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-secret
        run: npm run build
